name: Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://password-strength-checker-qa6b.onrender.com/api/health)
          echo "Health check returned: $response"
          if [ "$response" != "200" ]; then
            echo "Warning: Health check did not return 200"
            exit 1
          fi
